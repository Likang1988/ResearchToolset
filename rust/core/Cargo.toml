[package]
name = "research-toolset-core"
version = "0.1.0"
edition = "2021"
description = "科研工具集核心库：数据层与业务逻辑（UI 无关，供 Tauri 壳与独立测试复用）"
license = "GPL-3.0"

[lib]
name = "research_toolset_core"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# --- Excel 导入导出（openpyxl/pandas 的替代）---
calamine = "0.36"
rust_xlsxwriter = "0.97"

[dev-dependencies]
tempfile = "3"
