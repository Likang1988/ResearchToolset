<script type="text/javascript">
  $.JST.loadDecorator("RESOURCE_ROW", function(resTr, res){
    resTr.find(".delRes").click(function(){$(this).closest("tr").remove()});
  });

  $.JST.loadDecorator("ASSIGNMENT_ROW", function(assigTr, taskAssig){
    var resEl = assigTr.find("[name=resourceId]");
    var opt = $("<option>");
    resEl.append(opt);
    for(var i=0; i< taskAssig.task.master.resources.length;i++){
      var res = taskAssig.task.master.resources[i];
      opt = $("<option>");
      opt.val(res.id).html(res.name);
      if(taskAssig.assig.resourceId == res.id)
        opt.attr("selected", "true");
      resEl.append(opt);
    }
    var roleEl = assigTr.find("[name=roleId]");
    for(var i=0; i< taskAssig.task.master.roles.length;i++){
      var role = taskAssig.task.master.roles[i];
      var optr = $("<option>");
      optr.val(role.id).html(role.name);
      if(taskAssig.assig.roleId == role.id)
        optr.attr("selected", "true");
      roleEl.append(optr);
    }

    if(taskAssig.task.master.permissions.canWrite && taskAssig.task.canWrite){
      assigTr.find(".delAssig").click(function(){
        var tr = $(this).closest("[assId]").fadeOut(200, function(){$(this).remove()});
      });
    }

  });


  function loadI18n(){
    GanttMaster.messages = {

<script type="text/javascript">
// Tauri 版甘特桥：通过 postMessage 与父页面（React iframe 容器）通信。
// 父页面负责调用 Tauri IPC（load_gantt_data / save_gantt_data）并把结果回传，
// 本页负责渲染/编辑（复用 jQueryGantt）。

var ge;
var hasLoaded = false;

function notifyReady() {
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: "gantt_tauri_ready", source: "gantt" }, "*");
  }
}

function saveGanttData() {
  console.log("[gantt-tauri] Attempting to save...");
  if (typeof ge === "undefined" || !ge) {
    alert("错误：甘特图未初始化！");
    return;
  }
  var prj;
  try {
    prj = ge.saveProject();
    if (!prj || !prj.tasks) {
      alert("错误：无法获取甘特图数据进行保存！");
      return;
    }
  } catch (e) {
    console.error(e);
    alert("错误：调用 ge.saveProject() 时出错！");
    return;
  }
  var prjString;
  try {
    prjString = JSON.stringify(prj);
  } catch (e) {
    console.error(e);
    alert("错误：无法序列化甘特图数据！");
    return;
  }
  console.log("[gantt-tauri] Sending data to parent:", prjString);
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "gantt_tauri_save",
      source: "gantt",
      payload: prjString
    }, "*");
  }
}

// ===== 右侧操作按钮：新建 / 编辑 / 删除任务 =====
// 修正"新建"操作的选中逻辑（原库调用未实现的 selectTask，导致新建后无选中状态）
(function () {
  if (typeof GanttMaster === "undefined") return;
  GanttMaster.prototype.addNewRootTask = function () {
    if (!this.permissions.canAdd) {
      console.warn("No permission to add new tasks.");
      return;
    }
    this.beginTransaction();
    var factory = new TaskFactory();
    var newTask = factory.build("tmp_" + new Date().getTime(), "任务名称", "", 0, new Date().getTime(), 1);
    var task = this.addTask(newTask);
    this.endTransaction();
    if (task && task.rowElement) {
      this.currentTask = task;
      this.gantt.synchHighlight();
      task.rowElement.addClass("rowSelected");
      task.rowElement.find("[name=name]").focus();
    }
  };
})();

function getCurrentTask() {
  return (typeof ge !== "undefined" && ge) ? ge.currentTask : null;
}

// 把任务选中状态通知父页面（新建/编辑/删除按钮已移到父页面工具栏）
function notifyActionState() {
  var hasTask = !!getCurrentTask();
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "gantt_action_state",
      source: "gantt",
      data: { canEdit: hasTask, canDelete: hasTask }
    }, "*");
  }
}

function updateActionButtons() {
  var hasTask = !!getCurrentTask();
  var editBtn = document.getElementById("ganttEditTaskBtn");
  var delBtn = document.getElementById("ganttDeleteTaskBtn");
  if (editBtn) editBtn.disabled = !hasTask;
  if (delBtn) delBtn.disabled = !hasTask;
  notifyActionState();
}

function actionNewTask() {
  if (!ge) return;
  ge.addNewRootTask();
  updateActionButtons();
  // 不自动保存：新建后停留在行内编辑状态，由用户显式点"保存"按钮落库
}

function actionEditTask() {
  var task = getCurrentTask();
  if (!ge || !task) return;
  ge.editor.openFullEditor(task, false);
}

// WKWebView 不支持 window.confirm（总是返回 false），这里用自绘模态框替代
function confirmDialog(message) {
  var overlay = document.getElementById("ganttConfirmOverlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "ganttConfirmOverlay";
    overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:9999;display:none;align-items:center;justify-content:center;";
    overlay.innerHTML =
      '<div style="background:#fff;border-radius:6px;padding:18px 22px;min-width:260px;max-width:420px;box-shadow:0 6px 24px rgba(0,0,0,.25);font-family:\'Segoe UI\',\'Microsoft YaHei\',sans-serif;font-size:13px;">' +
      '<div id="ganttConfirmMsg" style="margin-bottom:16px;line-height:1.5;color:#333;"></div>' +
      '<div style="text-align:right;">' +
      '<button id="ganttConfirmOk" style="background:#d13438;color:#fff;border:none;border-radius:4px;padding:5px 16px;cursor:pointer;margin-right:8px;">确定</button>' +
      '<button id="ganttConfirmCancel" style="background:#f0f0f0;color:#333;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;">取消</button>' +
      '</div></div>';
    document.body.appendChild(overlay);
  }
  document.getElementById("ganttConfirmMsg").textContent = message;
  overlay.style.display = "flex";
  return new Promise(function (resolve) {
    function done(val) {
      overlay.style.display = "none";
      overlay.removeEventListener("click", onClick);
      document.removeEventListener("keydown", onKey);
      resolve(val);
    }
    function onClick(e) {
      if (e.target.id === "ganttConfirmOk") done(true);
      else if (e.target.id === "ganttConfirmCancel") done(false);
    }
    function onKey(e) {
      if (e.key === "Enter") done(true);
      else if (e.key === "Escape") done(false);
    }
    overlay.addEventListener("click", onClick);
    document.addEventListener("keydown", onKey);
  });
}

function actionDeleteTask() {
  var task = getCurrentTask();
  if (!ge || !task) return;
  var msg = "确定要删除选中的任务吗？";
  var isRoot = task.getRow() === 0;
  if (isRoot) {
    msg = "确定要删除根任务及其所有子任务吗？";
  }

  confirmDialog(msg).then(function (ok) {
    if (!ok) return;
    if (isRoot && !ge.isMultiRoot && !task.isNew()) {
      // 唯一的根任务：ge.deleteCurrentTask() 会因防误删保护而拒绝(row>0才删)，
      // 这里显式执行整棵根任务删除（deleteTask 会递归清理子任务与 DOM）
      ge.beginTransaction();
      task.deleteTask();
      ge.updateDependsStrings();
      ge.taskIsChanged();
      ge.endTransaction();
      ge.generateTaskCodes();
    } else {
      ge.deleteCurrentTask();
    }
    updateActionButtons();
    // 不自动保存：删除结果由用户显式点"保存"按钮落库
  });
}

// 导出：把当前甘特图数据发给父页面，由父页面弹"另存为"对话框并调用
// Tauri 命令 export_gantt（按扩展名输出 XLSX / JSON / CSV / TXT）
function actionExportGantt() {
  if (!ge) return;
  var prj;
  try {
    prj = ge.saveProject();
    if (!prj || !prj.tasks) {
      alert("错误：无法获取甘特图数据进行导出！");
      return;
    }
  } catch (e) {
    console.error(e);
    alert("错误：导出准备数据时出错：\n" + e.message);
    return;
  }
  console.log("[gantt-tauri] Sending export request to parent (tasks=" + prj.tasks.length + ")");
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "gantt_tauri_export",
      source: "gantt",
      payload: JSON.stringify(prj)
    }, "*");
  }
}

// 导入：请求父页面打开文件对话框读取 JSON，整体替换当前甘特图数据
function actionImportGantt() {
  if (!ge) return;
  console.log("[gantt-tauri] Sending import request to parent");
  if (window.parent && window.parent !== window) {
    window.parent.postMessage({
      type: "gantt_tauri_import",
      source: "gantt"
    }, "*");
  }
}

// 任务行是动态渲染的，用事件委托同步编辑/删除按钮的可用状态
$(document).on("click", ".taskEditRow", function () {
  updateActionButtons();
});

// 任务编辑器保存后自动保存到数据库（saveFullEditor.gantt 事件冒泡到 document）
$(document).on("saveFullEditor.gantt", function (e) {
  if ($(e.target).is("#saveButton")) {
    setTimeout(function () { saveGanttData(); }, 30);
  }
});

function applyIdMap(idMap) {
  if (!idMap || Object.keys(idMap).length === 0) return;
  console.log("[gantt-tauri] Applying id_map:", idMap);
  for (var tempId in idMap) {
    if (!idMap.hasOwnProperty(tempId)) continue;
    var persistentId = idMap[tempId];
    var task = ge.getTask(tempId);
    if (!task) continue;
    task.id = persistentId;
    delete ge.tasks.map[tempId];
    ge.tasks.map[persistentId] = task;

    var taskRow = ge.element.find("#tid_" + tempId);
    if (taskRow.length > 0) {
      taskRow.attr("id", "tid_" + persistentId);
      taskRow.attr("taskId", persistentId);
    }
    var taskBar = ge.element.find(".taskBox[taskId='" + tempId + "']");
    if (taskBar.length > 0) {
      taskBar.attr("taskId", persistentId);
    }
  }

  for (var i = 0; i < ge.tasks.length; i++) {
    var taskToUpdate = ge.tasks[i];
    if (taskToUpdate && taskToUpdate.depends &&
        typeof taskToUpdate.depends === "string" && taskToUpdate.depends.length > 0) {
      var newDepends = taskToUpdate.depends;
      for (var tempIdDep in idMap) {
        if (!idMap.hasOwnProperty(tempIdDep)) continue;
        var persistentIdDep = idMap[tempIdDep];
        var regex = new RegExp("\\b" + tempIdDep.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&") + "\\b", "g");
        newDepends = newDepends.replace(regex, persistentIdDep);
      }
      if (newDepends !== taskToUpdate.depends) {
        taskToUpdate.depends = newDepends;
        var rowDep = ge.element.find("#tid_" + taskToUpdate.id);
        if (rowDep.length > 0) {
          var dependsInput = rowDep.find("input[name='depends']");
          if (dependsInput.length > 0) dependsInput.val(newDepends);
        }
      }
    }
  }
  ge.redraw();
}

function loadProjectData(projectData) {
  try {
    ge.loadProject(projectData);
    ge.checkpoint();
    hasLoaded = true;
    updateActionButtons();
    console.log("[gantt-tauri] Project loaded (tasks=" + projectData.tasks.length + ")");
    notifyReady();
  } catch (e) {
    console.error("[gantt-tauri] loadProject error:", e);
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: "gantt_tauri_load_error", source: "gantt", message: String(e) }, "*");
    }
  }
}

window.addEventListener("message", function (evt) {
  var msg = evt.data;
  if (!msg || msg.source !== "gantt_parent") return;

  switch (msg.type) {
    case "load_project":
      loadProjectData(msg.data);
      break;
    case "task_action":
      // 父页面工具栏按钮：新建/编辑/删除任务（action 在 msg.data 中）
      var action = msg.data ? msg.data.action : null;
      if (action === "new") actionNewTask();
      else if (action === "edit") actionEditTask();
      else if (action === "delete") actionDeleteTask();
      break;
    case "save_result":
      if (msg.data && msg.data.error) {
        alert("保存失败：" + msg.data.error);
      } else {
        applyIdMap(msg.data && msg.data.id_map ? msg.data.id_map : {});
        ge.checkpoint();
        alert("保存成功");
      }
      break;
    case "export_result":
      if (msg.data && msg.data.error) {
        alert("导出失败：" + msg.data.error);
      } else {
        alert((msg.data && msg.data.message) ? msg.data.message : "导出成功");
      }
      break;
    case "import_result":
      if (msg.data && msg.data.error) {
        alert("导入失败：" + msg.data.error);
      } else {
        alert((msg.data && msg.data.message) ? msg.data.message : "导入成功");
      }
      break;
    default:
      break;
  }
});

$(function () {
  ge = new GanttMaster();
  ge.set100OnClose = true;
  ge.shrinkParent = true;
  ge.init($("#workSpace"));
  loadI18n();
  delete ge.gantt.zoom;

  console.log("[gantt-tauri] Gantt initialized. Waiting for parent load request...");
  notifyReady();
});
</script>
